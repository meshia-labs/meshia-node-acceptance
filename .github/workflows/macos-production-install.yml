name: Current public Mac installation
on:
  workflow_dispatch:
    inputs:
      cache_diagnostics:
        description: Capture bounded synthetic mounted xcrun cache metadata
        type: boolean
        default: false
      diagnostic_workspace_id:
        description: Exact disposable workspace UUID for cache diagnostics only
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: macos-production-install-36
  cancel-in-progress: false
jobs:
  macos:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Check isolated production profile
        run: python3 -m unittest -v test_production_install test_cache_diagnostics
      - name: Install public36 and await owner checks
        timeout-minutes: 12
        env:
          PAIR_GRANT: ${{ !inputs.cache_diagnostics && secrets.MESHIA_MAC36_PAIR_GRANT || '' }}
          CACHE_PAIR_GRANT: ${{ inputs.cache_diagnostics && secrets.MESHIA_MAC36_PAIR_GRANT || '' }}
          MESHIA_CACHE_DIAGNOSTICS: ${{ inputs.cache_diagnostics }}
          MESHIA_DIAGNOSTIC_WORKSPACE_ID: ${{ inputs.diagnostic_workspace_id }}
        run: python3 production_install.py "$RUNNER_TEMP/meshia-production-36"
      - name: Always clean only this hosted installation
        if: always()
        timeout-minutes: 2
        run: python3 acceptance.py cleanup --directory "$RUNNER_TEMP/meshia-production-36"
      - name: Publish sanitized receipt
        if: always()
        run: python3 report.py "$RUNNER_TEMP/meshia-production-36"
