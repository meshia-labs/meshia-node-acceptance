name: Native39 exact public Linux FUSE acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native39-linux-fuse
  cancel-in-progress: false
jobs:
  linux:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install distribution FUSE prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse libfuse2
          test -c /dev/fuse
          test "$(id -u)" != 0
      - name: Fetch exact public artifact
        run: |
          python -m pip install cryptography==50.0.1
          python linux_fuse_acceptance.py fetch --directory "$RUNNER_TEMP/native39-linux"
      - name: Install only the verified public wheel
        run: python -m pip install --no-cache-dir "$RUNNER_TEMP/native39-linux/meshia_node-1.3.39-py3-none-any.whl"
      - name: Actual ordinary-user Linux FUSE cases
        timeout-minutes: 5
        run: python linux_fuse_acceptance.py run --directory "$RUNNER_TEMP/native39-linux"
      - name: Preserve bounded acceptance receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native39-linux-fuse-${{ github.run_id }}
          path: ${{ runner.temp }}/native39-linux/linux-fuse-receipt.json
          if-no-files-found: warn
          retention-days: 14
