name: Exact notarized macOS acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: standalone-macos-1.3.18
  cancel-in-progress: false
jobs:
  macos:
    # This kit must never consume private-repository hosted minutes.
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout public acceptance kit only
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Use fixture Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Select owned temporary directory
        run: echo "MESHIA_ACCEPTANCE_DIR=$RUNNER_TEMP/meshia-standalone-1.3.18" >> "$GITHUB_ENV"
      - name: Verify exact package before any installation
        run: python acceptance.py verify --directory "$MESHIA_ACCEPTANCE_DIR"
      - name: Install exact wheel for the loopback account fixture
        run: python -m pip install --no-cache-dir release/meshia_node-1.3.18-py3-none-any.whl
      - name: Check portable kit without native installation
        run: python -m unittest -v test_kit
      - name: Stage verified artifacts on a fresh hosted account
        run: python acceptance.py fetch --directory "$MESHIA_ACCEPTANCE_DIR"
      - name: Native signed service, mount, Full and Workspace-only
        timeout-minutes: 12
        run: python acceptance.py run --directory "$MESHIA_ACCEPTANCE_DIR"
      - name: Always close owned service, mount and processes
        if: always()
        timeout-minutes: 2
        run: python acceptance.py cleanup --directory "$MESHIA_ACCEPTANCE_DIR"
      - name: Record bounded public result without artifact storage
        if: always()
        run: python report.py "$MESHIA_ACCEPTANCE_DIR"
